name: conatus_work
description: >-
  基于 conatus 的产品层。只消费 conatus 框架，不进伞包 re-export，不对外发布。
version: 0.1.0
repository: https://github.com/Fi2zz/conatus_work
issue_tracker: https://github.com/Fi2zz/conatus_work/issues
publish_to: none

environment:
  sdk: ^3.11.0

# 由 conatus 仓库 tool/setup_code_filter.sh 通过 git filter 管理：工作区为生效
# 状态、`git add` 时自动注释掉，因此独立 clone 仍按下面的 git 依赖解析。
# 见 .gitattributes 与本仓库 README「开发」。
# resolution: workspace

dependencies:
  # 独立形态经 git 源拉 conatus 伞包；在 conatus 工作区内由 workspace 解析到
  # 本地根包，改框架源码立刻生效。ref 由 tool/pin_conatus_refs.sh 钉版。
  conatus:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: 2f937e6f7ac0d8222630ea3b9a1dc15fded093cc}
  conatus_checkpoint:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: 2f937e6f7ac0d8222630ea3b9a1dc15fded093cc, path: packages/conatus_checkpoint}
  crypto: ^3.0.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

# 独立形态需要 overrides：伞包 git 源里的 conatus_checkpoint 与本节直接依赖的
# git ref 是两种源身份，不覆盖会求解失败（workspace 形态由 filter 生成的
# pubspec_overrides.yaml 清空）。
dependency_overrides:
  conatus_checkpoint:
    git: {url: https://github.com/Fi2zz/conatus.git, ref: 2f937e6f7ac0d8222630ea3b9a1dc15fded093cc, path: packages/conatus_checkpoint}
